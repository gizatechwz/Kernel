<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320"
     role="img" aria-labelledby="sk-title sk-desc">
  <title id="sk-title">kernelkite before and after comparison</title>
  <desc id="sk-desc">Grouped bar chart. For each metric a tall red bar shows the baseline value
    and a shorter green bar shows the optimized value. Proportions match samples/comparison.json:
    duration down 33 percent, cpu down 56 percent, peak rss down 60 percent, disk read down 57
    percent, disk write down 56 percent. Flat palette, no remote assets.</desc>

  <rect x="0" y="0" width="880" height="320" fill="#0f1720"/>

  <text x="40" y="34" font-family="monospace" font-size="16" font-weight="bold" fill="#e6edf3">compare: before to after</text>
  <text x="40" y="52" font-family="monospace" font-size="11" fill="#8fa3b8">baseline (red) against optimized (green), heights in proportion to real deltas</text>

  <!-- legend -->
  <g font-family="monospace" font-size="11">
    <rect x="660" y="26" width="14" height="14" fill="#d0503f"/>
    <text x="680" y="38" fill="#c9d6e2">before</text>
    <rect x="740" y="26" width="14" height="14" fill="#4f9d5c"/>
    <text x="760" y="38" fill="#c9d6e2">after</text>
  </g>

  <!-- baseline street -->
  <line x1="40" y1="264" x2="840" y2="264" stroke="#3d4c5e" stroke-width="2"/>

  <!-- duration 1500 -> 1000 : 180 -> 120 -->
  <g transform="translate(110,0)" font-family="monospace">
    <rect x="-38" y="84" width="30" height="180" fill="#d0503f"/>
    <rect x="4"  y="144" width="30" height="120" fill="#4f9d5c"/>
    <text x="-2" y="282" text-anchor="middle" font-size="11" fill="#c9d6e2">duration</text>
    <text x="-2" y="298" text-anchor="middle" font-size="11" fill="#4f9d5c">-33%</text>
  </g>

  <!-- cpu 2.79 -> 1.23 : 180 -> 79 -->
  <g transform="translate(270,0)" font-family="monospace">
    <rect x="-38" y="84" width="30" height="180" fill="#d0503f"/>
    <rect x="4"  y="185" width="30" height="79" fill="#4f9d5c"/>
    <text x="-2" y="282" text-anchor="middle" font-size="11" fill="#c9d6e2">cpu</text>
    <text x="-2" y="298" text-anchor="middle" font-size="11" fill="#4f9d5c">-56%</text>
  </g>

  <!-- peak rss 943 -> 373 : 180 -> 71 -->
  <g transform="translate(430,0)" font-family="monospace">
    <rect x="-38" y="84" width="30" height="180" fill="#d0503f"/>
    <rect x="4"  y="193" width="30" height="71" fill="#4f9d5c"/>
    <text x="-2" y="282" text-anchor="middle" font-size="11" fill="#c9d6e2">peak rss</text>
    <text x="-2" y="298" text-anchor="middle" font-size="11" fill="#4f9d5c">-60%</text>
  </g>

  <!-- disk read : 180 -> 77 -->
  <g transform="translate(590,0)" font-family="monospace">
    <rect x="-38" y="84" width="30" height="180" fill="#d0503f"/>
    <rect x="4"  y="187" width="30" height="77" fill="#4f9d5c"/>
    <text x="-2" y="282" text-anchor="middle" font-size="11" fill="#c9d6e2">disk read</text>
    <text x="-2" y="298" text-anchor="middle" font-size="11" fill="#4f9d5c">-57%</text>
  </g>

  <!-- disk write : 180 -> 80 -->
  <g transform="translate(750,0)" font-family="monospace">
    <rect x="-38" y="84" width="30" height="180" fill="#d0503f"/>
    <rect x="4"  y="184" width="30" height="80" fill="#4f9d5c"/>
    <text x="-2" y="282" text-anchor="middle" font-size="11" fill="#c9d6e2">disk write</text>
    <text x="-2" y="298" text-anchor="middle" font-size="11" fill="#4f9d5c">-56%</text>
  </g>
</svg>
