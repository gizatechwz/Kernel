<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     role="img" aria-labelledby="kk-title kk-desc">
  <title id="kk-title">kernelkite: sample the process subtree, land a deterministic bundle</title>
  <desc id="kk-desc">Left to right data flow. A launched command forks a subtree of processes.
    kernelkite samples the subtree from /proc on a fixed interval, collecting CPU, RSS and IO
    counters into ordered frames, then writes a deterministic bundle that can be summarized,
    diffed, and rendered. Flat two-color palette, no remote assets.</desc>

  <rect x="0" y="0" width="880" height="300" fill="#0f1720"/>

  <!-- interval ruler: the fixed sampling cadence -->
  <g stroke="#3d4c5e" stroke-width="1">
    <line x1="60" y1="70" x2="820" y2="70"/>
    <line x1="120" y1="64" x2="120" y2="76"/>
    <line x1="220" y1="64" x2="220" y2="76"/>
    <line x1="320" y1="64" x2="320" y2="76"/>
    <line x1="420" y1="64" x2="420" y2="76"/>
    <line x1="520" y1="64" x2="520" y2="76"/>
    <line x1="620" y1="64" x2="620" y2="76"/>
  </g>
  <text x="60" y="52" font-family="monospace" font-size="12" fill="#8fa3b8">fixed interval, tick by tick</text>
  <!-- the sampling head sweeps the ruler in even steps -->
  <rect x="112" y="60" width="16" height="20" fill="#e0b341">
    <animate attributeName="x" values="112;212;312;412;512;612;112" dur="4.2s" repeatCount="indefinite"/>
  </rect>

  <!-- launched command -->
  <g font-family="monospace">
    <rect x="60" y="120" width="120" height="46" fill="none" stroke="#5fb3a1" stroke-width="2"/>
    <text x="120" y="142" text-anchor="middle" font-size="13" fill="#e6edf3">cargo build</text>
    <text x="120" y="158" text-anchor="middle" font-size="10" fill="#8fa3b8">launched cmd</text>
  </g>

  <!-- fork into subtree -->
  <g stroke="#5fb3a1" stroke-width="2" fill="none">
    <path d="M180 132 H 240 V 108 H 300"/>
    <path d="M180 150 H 240 V 150 H 300"/>
    <path d="M180 156 H 240 V 196 H 300"/>
  </g>

  <!-- process subtree towers, height = relative CPU burn -->
  <g font-family="monospace">
    <rect x="300" y="96"  width="70" height="24" fill="#2b3a4d" stroke="#5fb3a1"/>
    <text x="335" y="112" text-anchor="middle" font-size="11" fill="#e6edf3">rustc</text>
    <rect x="300" y="138" width="70" height="24" fill="#2b3a4d" stroke="#5fb3a1"/>
    <text x="335" y="154" text-anchor="middle" font-size="11" fill="#e6edf3">rustc</text>
    <rect x="300" y="184" width="70" height="24" fill="#2b3a4d" stroke="#5fb3a1"/>
    <text x="335" y="200" text-anchor="middle" font-size="11" fill="#e6edf3">ld</text>
  </g>

  <!-- frames: each tick captures a column of counters -->
  <g font-family="monospace">
    <text x="430" y="90" font-size="11" fill="#8fa3b8">frames (cpu / rss / io)</text>
    <g fill="#e0b341">
      <rect x="430" y="100" width="10" height="60"/>
      <rect x="450" y="112" width="10" height="48"/>
      <rect x="470" y="120" width="10" height="40"/>
      <rect x="490" y="108" width="10" height="52"/>
      <rect x="510" y="128" width="10" height="32"/>
      <rect x="530" y="134" width="10" height="26"/>
      <rect x="550" y="140" width="10" height="20"/>
    </g>
    <line x1="428" y1="162" x2="562" y2="162" stroke="#3d4c5e" stroke-width="1"/>
  </g>

  <!-- deterministic bundle output -->
  <g font-family="monospace">
    <rect x="640" y="110" width="150" height="80" fill="none" stroke="#e0b341" stroke-width="2"/>
    <text x="715" y="132" text-anchor="middle" font-size="12" fill="#e6edf3">bundle.json</text>
    <line x1="656" y1="144" x2="774" y2="144" stroke="#3d4c5e"/>
    <text x="656" y="160" font-size="10" fill="#8fa3b8">ordered frames</text>
    <text x="656" y="174" font-size="10" fill="#8fa3b8">host constants</text>
    <text x="656" y="188" font-size="10" fill="#5fb3a1">same input, same bytes</text>
  </g>

  <!-- connectors subtree -> frames -> bundle -->
  <g stroke="#3d4c5e" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="372" y1="150" x2="426" y2="150"/>
    <line x1="566" y1="150" x2="636" y2="150"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#3d4c5e"/>
    </marker>
  </defs>

  <!-- wordmark -->
  <g font-family="monospace">
    <text x="60" y="250" font-size="26" font-weight="bold" fill="#e6edf3">kernel<tspan fill="#5fb3a1">kite</tspan></text>
    <text x="60" y="272" font-size="12" fill="#8fa3b8">local /proc process-loop profiler, deterministic replay on any OS</text>
  </g>
</svg>

