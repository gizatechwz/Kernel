[package]
name = "kernelkite-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core sampling, modeling and comparison engine for kernelkite"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# The `ebpf` feature is a placeholder switch for a FUTURE eBPF backend.
# It is intentionally NOT implemented. Enabling it compiles a stub backend
# that returns an explicit "not implemented" error at runtime so that no
# fabricated eBPF data is ever produced. See docs/PROFILE.md.
ebpf = []

[lib]
name = "kernelkite_core"
